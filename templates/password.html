{% extends "base.html" %}
{% block content %}
<h2>Password Generator</h2>
<p class="text-muted">Create a strong random password with a mix of characters. Length can be up to 63 characters.</p>
<div class="card shadow">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Length (1-63)</label>
                <input type="number" name="length" class="form-control" value="16" min="1" max="63" required>
            </div>
            <div class="mb-3">
                <div class="form-check form-check-inline">
                    <input type="checkbox" name="upper" class="form-check-input" id="upper" checked>
                    <label class="form-check-label" for="upper">Uppercase</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" name="lower" class="form-check-input" id="lower" checked>
                    <label class="form-check-label" for="lower">Lowercase</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" name="digits" class="form-check-input" id="digits" checked>
                    <label class="form-check-label" for="digits">Digits</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" name="special" class="form-check-input" id="special" checked>
                    <label class="form-check-label" for="special">Special</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Generate</button>
        </form>
        {% if password %}
        <hr>
        <div class="mb-3">
            <label class="form-label">Generated Password</label>
            <input type="text" class="form-control" value="{{ password }}" readonly>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
