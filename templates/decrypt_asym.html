{% extends "base.html" %}
{% block content %}
<h2>Asymmetric Decryption</h2>
<p class="text-muted">Choose an encrypted .rsa file and provide the matching private key to recover the original file.</p>
<div class="card shadow">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Encrypted File Source</label>
                <select name="file_source" id="fsrc" class="form-select" onchange="toggleFile()">
                    <option value="upload">Upload an encrypted file from my computer</option>
                    <option value="saved">Choose a saved file from this site</option>
                </select>
                <p class="form-text text-muted" id="file_source_desc"></p>
            </div>
            <div class="mb-3" id="fileupload">
                <label class="form-label">Encrypted file (.rsa)</label>
                <input type="file" name="file" class="form-control">
            </div>
            <div class="mb-3" id="filesaved" style="display:none">
                <label class="form-label">Saved File</label>
                <select name="file_id" class="form-select">
                    {% for f in files %}
                    <option value="{{ f.id }}">{{ f.filename }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Private Key Source</label>
                <select name="key_source" id="ksrc" class="form-select" onchange="toggleKey()">
                    <option value="saved">Use saved private key</option>
                    <option value="file">Upload private key file</option>
                </select>
                <p class="form-text text-muted" id="key_source_desc"></p>
            </div>
            <div class="mb-3" id="savedkey">
                <label class="form-label">Saved Private Key</label>
                <select name="key_id" class="form-select">
                    {% for k in keys %}
                    <option value="{{ k.id }}">{{ k.name }} ({{ k.key_type }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3" id="keyfile" style="display:none">
                <label class="form-label">Private Key File (.pem)</label>
                <input type="file" name="private_key" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Decrypt and Save</button>
        </form>
    </div>
</div>
<script>
const fileSourceDescs = {
    upload: 'Select the encrypted .rsa file from your computer.',
    saved: 'Pick an encrypted file you already saved on this site.'
};
const keySourceDescs = {
    saved: 'Choose the private key that matches the public key used for encryption.',
    file: 'Upload the matching private key file from your computer.'
};
function toggleFile() {
    const src = document.getElementById('fsrc').value;
    document.getElementById('fileupload').style.display = src === 'upload' ? 'block' : 'none';
    document.getElementById('filesaved').style.display = src === 'saved' ? 'block' : 'none';
    document.getElementById('file_source_desc').textContent = fileSourceDescs[src] || '';
}
function toggleKey() {
    const src = document.getElementById('ksrc').value;
    document.getElementById('savedkey').style.display = src === 'saved' ? 'block' : 'none';
    document.getElementById('keyfile').style.display = src === 'file' ? 'block' : 'none';
    document.getElementById('key_source_desc').textContent = keySourceDescs[src] || '';
}
toggleFile();
toggleKey();
</script>
{% endblock %}
