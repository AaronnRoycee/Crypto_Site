{% extends "base.html" %}
{% block content %}
<h2>{{ key.name }}</h2>
<p class="text-muted">View the generated key below. Click Show to reveal it and Copy to copy it to the clipboard.</p>
<div class="card shadow">
    <div class="card-body">
        <div class="mb-3">
            <label class="form-label">Key Type: {{ key.key_type }}</label>
            <textarea class="form-control font-monospace" rows="8" id="display" readonly></textarea>
            <textarea style="display:none;" id="real">{{ content }}</textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-secondary" id="toggle">Show</button>
            <button type="button" class="btn btn-primary" id="copy">Copy</button>
        </div>
    </div>
</div>
<a href="{{ url_for('keys') }}" class="btn btn-link mt-3">Back to keys</a>
<script>
const real = document.getElementById('real').value;
const display = document.getElementById('display');
const toggle = document.getElementById('toggle');
const copy = document.getElementById('copy');
let shown = false;

function mask(s) {
    let out = '';
    for (const c of s) {
        out += c === '\n' ? '\n' : '\u2022';
    }
    return out;
}

function update() {
    display.value = shown ? real : mask(real);
    toggle.textContent = shown ? 'Hide' : 'Show';
}

toggle.addEventListener('click', function() {
    shown = !shown;
    update();
});

copy.addEventListener('click', function() {
    navigator.clipboard.writeText(real).then(function() {
        copy.textContent = 'Copied';
        setTimeout(function() { copy.textContent = 'Copy'; }, 1500);
    });
});

update();
</script>
{% endblock %}
