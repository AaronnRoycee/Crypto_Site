{% extends "base.html" %}
{% block content %}
<h2>Asymmetric Encryption</h2>
<p class="text-muted">Upload a file and select a public key. Only the matching private key can decrypt the resulting file.</p>
<div class="card shadow">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">File to encrypt</label>
                <input type="file" name="file" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Public Key Source</label>
                <select name="key_source" id="ksrc" class="form-select" onchange="toggleKey()">
                    <option value="saved">Use saved public key</option>
                    <option value="file">Upload public key file</option>
                </select>
                <p class="form-text text-muted" id="key_source_desc"></p>
            </div>
            <div class="mb-3" id="savedkey">
                <label class="form-label">Saved Public Key</label>
                <select name="key_id" class="form-select">
                    {% for k in keys %}
                    <option value="{{ k.id }}">{{ k.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3" id="keyfile" style="display:none">
                <label class="form-label">Public Key File (.pem)</label>
                <input type="file" name="public_key" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Encrypt and Save</button>
        </form>
    </div>
</div>
<script>
const keySourceDescs = {
    saved: 'Choose a public key you already saved on this site.',
    file: 'Upload a public key file from your computer.'
};
function toggleKey() {
    const src = document.getElementById('ksrc').value;
    document.getElementById('savedkey').style.display = src === 'saved' ? 'block' : 'none';
    document.getElementById('keyfile').style.display = src === 'file' ? 'block' : 'none';
    document.getElementById('key_source_desc').textContent = keySourceDescs[src] || '';
}
toggleKey();
</script>
{% endblock %}
